name: Update README cards

on:
  schedule:
    - cron: "0 12 * * *"
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate stats card (dark)
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&include_all_commits=true&show=reviews,prs_merged&hide=stars&hide_border=true&theme=github_dark
          path: profile/stats-dark.svg
          token: ${{ secrets.PAT }}
          fail_on_error: true

      - name: Generate stats card (light)
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&include_all_commits=true&show=reviews,prs_merged&hide=stars&hide_border=true&theme=default
          path: profile/stats.svg
          token: ${{ secrets.PAT }}
          fail_on_error: true

      - name: Generate top languages card (dark)
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=8&size_weight=0.5&count_weight=0.5&hide=jupyter notebook&hide_border=true&theme=github_dark
          path: profile/top-langs-dark.svg
          token: ${{ secrets.PAT }}
          fail_on_error: true

      - name: Generate top languages card (light)
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=8&size_weight=0.5&count_weight=0.5&hide=jupyter notebook&hide_border=true&theme=default
          path: profile/top-langs.svg
          token: ${{ secrets.PAT }}
          fail_on_error: true

      - name: Commit cards
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Update README cards" || exit 0
          git push